[package]
name = "vault-desktop"
version = "0.1.0"
description = "Vault — your games, your people, your world"
authors = ["Vault contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
